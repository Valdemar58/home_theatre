name: ${COMPOSE_PROJECT_NAME:-home-theater}

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  database:
    <<: *runtime
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated by install.sh}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U calendar -d calendar']
      interval: 5s
      timeout: 5s
      retries: 30

  application:
    <<: *runtime
    image: ${SERVER_IMAGE:?Choose an immutable server image}
    user: "1000:1000"
    init: true
    env_file: [application.env]
    environment:
      DATABASE_DRIVER: postgres
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:-calendar}
      PGUSER: calendar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_DIR: /data
      STREAM_DIR: /data/stream
      DATABASE_IMPORT_SQLITE: "off"
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_COOKIE_SECURE: ${COOKIE_SECURE}
      LEGACY_AUTH_ENABLED: "0"
    volumes:
      - ./data:/data
      - ./profiles.toml:/profiles.toml:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-5056}:5056"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:5056/api/health/database']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

  proxy:
    <<: *runtime
    image: ${PROXY_IMAGE:-caddy:2.10-alpine}
    profiles: [https]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      UNLEASH_UPSTREAM: ${UNLEASH_UPSTREAM:-application:5056}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on:
      application:
        condition: service_healthy

  prowlarr:
    <<: *runtime
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:latest}
    profiles: [search]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    volumes:
      - ./modules/prowlarr:/config
    ports: ["127.0.0.1:${PROWLARR_PORT:-9696}:9696"]

  ollama:
    <<: *runtime
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [llm]
    volumes:
      - ./modules/ollama:/root/.ollama

  unleash:
    <<: *runtime
    image: ${UNLEASH_IMAGE:-unleashorg/unleash-server:8.3.1}
    profiles: [flags]
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${UNLEASH_DATABASE_NAME:-unleash}
      DATABASE_USERNAME: unleash
      DATABASE_PASSWORD: ${UNLEASH_DATABASE_PASSWORD:-}
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "4"
      UNLEASH_DEFAULT_ADMIN_USERNAME: ${UNLEASH_DEFAULT_ADMIN_USERNAME:-homeadmin}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_DEFAULT_ADMIN_PASSWORD:-}
      UNLEASH_SECRET: ${UNLEASH_SESSION_SECRET:-}
      BASE_URI_PATH: /unleash
      UNLEASH_URL: ${PUBLIC_URL}/unleash
      LOG_LEVEL: warn
    ports: ["127.0.0.1:${UNLEASH_PORT:-4242}:4242"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:4242/unleash/health']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

volumes:
  database:
  certificates:
  proxy-config:
