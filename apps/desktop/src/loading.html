<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'"><title>home_theater</title><link rel="stylesheet" href="loading.css"></head><body>
<main><section class="update-content" aria-labelledby="heading"><img class="app-icon" src="icon.png" width="48" height="48" alt=""><div class="heading-row"><span class="spinner" aria-hidden="true"></span><h1 id="heading">Проверяем обновления</h1></div><p id="detail" role="status">Перед подключением к вашему серверу</p>
<div id="download" hidden><progress id="progress" value="0" max="100" aria-label="Загрузка обновления"></progress><output id="transfer"></output></div><p id="error" role="alert" hidden></p>
<div class="update-meta"><span id="version"></span><label>Канал<select id="channel" aria-label="Канал обновлений" disabled><option value="stable">Стабильные</option><option value="preview">Тестовые</option></select></label></div>
<div class="actions"><button id="primary" type="button" hidden>Повторить</button><button id="releases" class="quiet" type="button" hidden>Скачать вручную</button><button id="exit" class="quiet" type="button" hidden>Закрыть</button></div>
<div class="actions" id="navigation" hidden><button id="back" class="quiet" type="button">Вернуться</button><button id="choose" class="quiet" type="button">Выбрать другой сервер</button><button id="local" class="quiet" type="button">Локальные файлы</button></div>
<p id="action-error" role="alert" hidden></p></section></main><script src="loading.js"></script></body></html>
