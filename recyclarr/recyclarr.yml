# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Recyclarr v8: профили качества и custom formats из TRaSH Guides.
# Документация: https://recyclarr.dev
#
# Запускается не по расписанию, а из bootstrap.py (шаги recyclarr → formats):
#   python scripts/bootstrap.py --only recyclarr,formats
# Тогда после синхронизации сразу применяются наши правки: форматы озвучек
# из profiles.toml и язык «Any» в Radarr (TRaSH ставит «Original», и такой
# профиль отсекает фильмы, у которых есть только русский дубляж).
#
# Аниме здесь нет специально: профиль TRaSH для аниме заточен под англ. фансаб
# (minFormatScore 100, «Dubs Only» = -10000). Профиль «Anime RU» создаёт bootstrap.py.

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    # Размеры «anime»: минимум для сериалов TRaSH (~15 МБ/мин) отсекает обычные аниме-релизы
    # (300–400 МБ на серию в 1080p), а для западных сериалов anime-размеры тоже подходят
    quality_definition:
      type: anime

    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
        reset_unmatched_scores:
          enabled: false

radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: false
