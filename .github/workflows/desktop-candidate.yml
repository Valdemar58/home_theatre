name: Desktop candidate
on:
  workflow_dispatch:
    inputs:
      approve_stable:
        description: 'Owner only: approve stable publication when package version is stable'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-candidate
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: nsis
          - os: ubuntu-24.04
            platform: linux
            target: AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=low
      - run: node ../../scripts/ci/desktop-native.cjs --with-electron
      - run: pnpm test
      - name: Build candidate
        run: node node_modules/electron-builder/out/cli/cli.js build --${{ matrix.platform }} ${{ matrix.target }} --x64 --publish never --config.electronDist=node_modules/electron/dist
      - name: Verify installed Windows updates
        if: matrix.platform == 'win'
        run: node test/installed-updates.mjs --output ../../.local/installed-updates
      - name: Preserve installed update evidence
        if: always() && matrix.platform == 'win'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-update-proof
          path: |
            .local/installed-updates/installed-update-proof.json
            .local/installed-updates/**/*-build.log
            .local/installed-updates/**/trace.jsonl
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify packaged source and updater feed
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = win ]; then archive=release/win-unpacked/resources/app.asar; else archive=release/linux-unpacked/resources/app.asar; fi
          node test/verify-package.mjs "$archive"
          node -e "const fs=require('fs');fs.writeFileSync('release/build-${{ matrix.platform }}.json',JSON.stringify({version:require('./package.json').version,commit:process.env.GITHUB_SHA}))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-*.yml
            apps/desktop/release/build-*.json
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir apps/desktop install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true
      - name: Verify and publish complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_STABLE: ${{ inputs.approve_stable }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          approval=()
          if [ "$APPROVE_STABLE" = true ]; then approval=(--approve-stable); fi
          node scripts/ci/desktop-release.mjs prepare assets "$version" "$GITHUB_REPOSITORY" "$GITHUB_SHA" feed "${approval[@]}"
          python3 scripts/ci/publish-desktop.py --assets assets --feed feed --version "$version" --commit "$GITHUB_SHA" "${approval[@]}"
