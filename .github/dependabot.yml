version: 2
updates:
  - package-ecosystem: npm
    directories: ['/apps/anime-calendar', '/apps/desktop']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/apps/anime-calendar', '/apps/desktop']
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible:
        update-types: [minor, patch]
