#r5-desktop .r5-custom-server{display:grid;gap:18px;margin-top:22px}

#r5-desktop .r5-probe{display:flex;gap:11px;align-items:flex-start;min-height:86px;margin-top:24px;padding:15px 0;border-top:1px solid var(--r5-line);color:var(--r5-muted)}
#r5-desktop .r5-probe>svg,#r5-desktop .r5-probe>.r5-spinner{width:18px;height:18px;margin-top:1px;flex-shrink:0}
#r5-desktop .r5-probe strong{font-size:13px;font-weight:500;color:var(--r5-ink)}
#r5-desktop .r5-probe p{font-size:12px;margin-top:5px;line-height:1.5;overflow-wrap:anywhere}
#r5-desktop .r5-probe[aria-busy=true] strong{color:var(--r5-accent-ink)}
#r5-desktop .r5-probe[data-result=verified]>svg{color:var(--r5-good)}
#r5-desktop .r5-probe[data-result=error]>svg{color:var(--r5-error)}
#r5-desktop .r5-page.r5-panel-enter{animation:r5-arrive var(--r5-motion) cubic-bezier(.16,1,.3,1)}
#r5-desktop .r5-popover{animation:r5-popover-open 150ms ease-out}
@keyframes r5-popover-open{from{opacity:.75;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
#r5-desktop .r5-stage,#r5-desktop #r5-footer{position:relative;z-index:1}
#r5-desktop .r5-motion-toggle{margin-left:auto}
#r5-desktop .r5-chrome:has(#r5-motion-toggle:not([hidden])) .r5-platform{margin-left:8px}
#r5-desktop .r5-aurora{position:absolute;inset:44px 0 0;overflow:hidden;contain:paint;pointer-events:none;z-index:0;border-radius:0 0 var(--r5-radius) var(--r5-radius)}
#r5-desktop .r5-aurora-plane{position:absolute;inset:-25%;transform:translate(var(--r5-pan-x,0%),var(--r5-pan-y,0%));transition:transform var(--r5-motion) cubic-bezier(.16,1,.3,1)}
#r5-desktop .r5-blob{position:absolute;border-radius:36% 64% 69% 31% / 58% 32% 68% 42%;filter:blur(42px);animation:r5-drift-one 34s ease-in-out infinite alternate,r5-morph 12s ease-in-out infinite;opacity:.24}
#r5-desktop .r5-blob-one{left:-4%;top:6%;width:56%;height:65%;background:var(--r5-accent)}
#r5-desktop .r5-blob-two{left:48%;top:-8%;width:48%;height:56%;background:oklch(.64 .15 302);opacity:.17;animation-name:r5-drift-two,r5-morph;animation-duration:42s,15s;animation-delay:-14s,-5s}
#r5-desktop .r5-blob-three{left:43%;top:64%;width:54%;height:56%;background:oklch(.64 .10 232);opacity:.18;animation-name:r5-drift-three,r5-morph;animation-duration:38s,13s;animation-delay:-9s,-8s;animation-direction:alternate,reverse}
#r5-desktop .r5-aurora-veil{position:absolute;inset:0;background:rgb(17 24 39 / .22)}
#r5-desktop .r5-window:not(.r5-motion-paused) .r5-blob{will-change:transform}
#r5-desktop .r5-motion-paused .r5-blob{animation-play-state:paused}
@keyframes r5-drift-one{from{transform:translate(-5%,2%) rotate(-5deg) scale(.95)}to{transform:translate(9%,-7%) rotate(7deg) scale(1.04)}}
@keyframes r5-drift-two{from{transform:translate(4%,-6%) rotate(4deg)}to{transform:translate(-9%,8%) rotate(-8deg)}}
@keyframes r5-drift-three{from{transform:translate(5%,6%) scale(1)}to{transform:translate(-8%,-7%) scale(1.08)}}
@keyframes r5-morph{0%,100%{border-radius:36% 64% 69% 31% / 58% 32% 68% 42%}25%{border-radius:68% 32% 37% 63% / 31% 57% 43% 69%}50%{border-radius:29% 71% 52% 48% / 67% 28% 72% 33%}75%{border-radius:57% 43% 28% 72% / 42% 73% 27% 58%}}
@media(max-width:680px){#r5-desktop .r5-stage{padding:32px 24px;min-height:510px}#r5-desktop h1{font-size:26px}#r5-desktop .r5-modes{grid-template-columns:1fr;gap:12px}#r5-desktop .r5-mode{padding:18px}#r5-desktop .r5-mode strong{margin-bottom:5px}#r5-desktop .r5-unavailable{margin-top:10px}#r5-desktop .r5-connection{flex-wrap:wrap}#r5-desktop .r5-connection>div{min-width:170px}#r5-desktop .r5-connection>button{margin-left:39px}#r5-desktop .r5-welcome-points{gap:16px;flex-wrap:wrap}#r5-desktop .r5-home{padding:24px 20px}#r5-desktop .r5-continuation{gap:16px;padding:18px}#r5-desktop .r5-media-nav .r5-search{display:none}#r5-desktop .r5-continuation h3{font-size:17px}#r5-desktop .r5-chrome{padding-right:100px}#r5-desktop .r5-platform{display:none}}
@media(max-width:440px){#r5-desktop .r5-demo{display:grid}#r5-desktop .r5-demo select{max-width:235px}#r5-desktop .r5-stage{padding:30px 20px}#r5-desktop h1{font-size:24px}#r5-desktop .r5-welcome-points{gap:12px;font-size:12px}#r5-desktop .r5-welcome-points svg{width:16px;height:16px}#r5-desktop #r5-footer{padding:12px 18px 22px;gap:8px}#r5-desktop .r5-step-caption{font-size:11px}#r5-desktop .r5-dots{gap:6px}#r5-desktop .r5-dot{width:6px;height:6px}#r5-desktop .r5-dot.current{width:15px}#r5-desktop .r5-shell{grid-template-columns:46px 1fr}#r5-desktop .r5-sidebar{padding:18px 4px}#r5-desktop .r5-home{padding:22px 16px}#r5-desktop .r5-cover{display:none}#r5-desktop .r5-continuation{padding:16px}#r5-desktop .r5-session-line,#r5-desktop .r5-download-line{flex-wrap:wrap;gap:12px}#r5-desktop .r5-dialog{padding:22px}#r5-desktop .r5-actions{gap:8px}#r5-desktop input{font-size:16px}}
@media(prefers-reduced-motion:reduce){#r5-desktop *,#r5-desktop *:before,#r5-desktop *:after{animation:none!important;transition:none!important}}
</style>
<script>
(()=>{
const root=document.getElementById('r5-desktop');
const $=s=>root.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const prod={id:'prod',name:'Пивосинема',host:'pivocinema.duckdns.org',auth:true,access:'approved',bound:true};
const dev={id:'dev',name:'Пивосинема · разработка',host:'pivocinemadev.duckdns.org',auth:true,access:'approved',bound:true};
const steps=['Знакомство','Режим','Сервер','Аккаунт','Доступ','Подключения','Синхронизация'];
let state, generation=0, toastTimer,lastWidgetSnapshot='',lastRenderedStep=null;
let windowVisible=true;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const tweaks={width:610,motion:360,compact:false};
function fresh(){const profile={...prod,auth:false,access:null,bound:false};return {step:'welcome',server:profile,profiles:[profile],scenario:'fresh',motionPaused:false,register:false,error:'',waiting:false,invite:false,shiki:false,bound:false,adding:false,customServer:false,pickerOpen:false,probe:null,menu:false,menuFilter:'',query:'',customName:'',menuDialog:null,sync:0,syncDone:false,importError:false,page:'home',activeJob:false,watching:false};}
function icons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18}});}
function persist(){const {query,probe,pickerOpen,menuFilter,menuDialog,...ui}=state;lastWidgetSnapshot=JSON.stringify(ui);window.openai?.setWidgetState?.({modelContent:{prototype:'r5-desktop-v1',screen:state.step,server:state.server.host,scenario:state.scenario},privateContent:{version:1,ui}})?.catch(()=>{});}
function focusStep(){const stage=$('#r5-stage');const next=stage.querySelector('input:not(:disabled),button:not(:disabled)')||$('#r5-server-menu');requestAnimationFrame(()=>next.focus({preventScroll:true}));$('#r5-announcer').textContent=stage.querySelector('h1')?.textContent||'';}
function go(step){const order=['welcome','mode','server','auth','access','links','sync','home'];root.style.setProperty('--r5-slide-from',order.indexOf(step)<order.indexOf(state.step)?'-14px':'14px');generation++;state.step=step;state.error='';state.menu=false;state.pickerOpen=false;state.menuDialog=null;render();focusStep();persist();}
function button(text,action,kind='primary',extra=''){return `<button type="button" class="r5-${kind}" data-action="${action}" ${extra}>${text}</button>`;}
function intro(title,copy,body='',narrow=false){return `<section class="r5-page${narrow?' narrow':''}"><h1>${title}</h1><p class="r5-intro">${copy}</p>${body}</section>`;}
function error(){return `<div class="r5-error" role="alert">${state.error?icon('circle-alert')+`<span>${esc(state.error)}</span>`:''}</div>`;}
function rows(profiles,context){return profiles.map(p=>`<button type="button" class="r5-server-row" data-action="${context==='menu'?'select-profile':'pick-server'}" data-id="${esc(p.id)}" role="menuitemradio" aria-checked="${(context==='menu'?state.server.id:state.draftId||state.server.id)===p.id}">${icon('server')}<span class="r5-server-copy"><strong>${esc(p.name)}</strong><small>${esc(p.host)}</small></span>${(context==='menu'?state.server.id:state.draftId||state.server.id)===p.id?icon('check'):''}</button>`).join('');}
function serverOptions(context){return `<div id="r5-${context}-options" class="r5-picker-panel" role="menu" aria-label="Серверы"><p class="r5-picker-heading">Ваши серверы</p>${rows(state.profiles,context)}<div class="r5-picker-divider"></div><button type="button" class="r5-server-row r5-add-server" role="menuitem" data-action="${context==='menu'?'add-server':'custom-server'}">${icon('plus')}<span class="r5-server-copy"><strong>Добавить сервер</strong><small>Подключиться по своему адресу</small></span></button></div>`;}
function serverPicker(context){if(context==='menu')return serverOptions(context);const selected=state.profiles.find(p=>p.id===state.draftId)||state.server;return `<div class="r5-server-field r5-picker"><span class="r5-label">Сервер управления</span><button type="button" class="r5-picker-trigger" data-action="toggle-picker" aria-haspopup="menu" aria-expanded="${!!state.pickerOpen}" aria-controls="r5-wizard-options">${icon(state.customServer?'globe':'server')}<span class="r5-server-copy"><strong>${state.customServer?'Свой сервер':esc(selected.name)}</strong><small>${state.customServer?'Укажите адрес ниже':esc(selected.host)}</small></span>${icon('chevron-down')}</button>${state.pickerOpen?serverOptions(context):''}</div>`;}
function probeStatus(){const p=state.probe;return `<div class="r5-probe" data-result="${p?.status||'idle'}" role="status" aria-live="polite" aria-atomic="true" ${p?.status==='checking'?'aria-busy="true"':''}>${p?`${p.status==='checking'?'<span class="r5-spinner" aria-hidden="true"></span>':icon(p.status==='verified'?'circle-check':'circle-alert')}<div><strong>${esc(p.title)}</strong><p>${esc(p.detail)}</p></div>`:`${icon('shield-check')}<div><strong>Проверим перед входом</strong><p>Соединение, тип сервера и совместимость приложения.</p></div>`}</div>`;}
function serverScreen(){const p=state.probe,checking=p?.status==='checking';return intro(state.adding?'Подключить сервер':'Где будем смотреть?', 'Здесь будут храниться ваш аккаунт, списки и прогресс.', `${serverPicker('wizard')}${state.customServer?`<div class="r5-custom-server"><label><span class="r5-label">Адрес сервера</span><input id="r5-wizard-query" data-address="true" type="text" inputmode="url" autocomplete="off" placeholder="cinema.example.org" value="${esc(state.query)}" ${p?.invalidAddress?'aria-invalid="true"':''} aria-describedby="r5-address-hint"></label><p id="r5-address-hint" class="r5-address-hint">HTTPS · без пути и параметров</p><label><span class="r5-label">Название (необязательно)</span><input id="r5-custom-name" placeholder="Мой кинозал" maxlength="60" value="${esc(state.customName)}"></label></div>`:''}<div id="r5-probe-slot">${probeStatus()}</div><div class="r5-actions end">${button(checking?'Проверяем…':p?.status==='verified'?'Продолжить':p?.status==='error'?'Повторить проверку':'Связать','connect','primary',checking?'disabled':'')}</div>`,true);}
function welcome(){return `<section class="r5-page welcome"><div class="r5-welcome-mark">${icon('clapperboard')}</div><h1>Ваши истории.<br>Ваш следующий вечер.</h1><p class="r5-intro">Аниме, манга и ранобэ — в одном месте. Планируйте просмотр, сохраняйте прогресс и собирайте друзей. Серии загружаются на ваш компьютер.</p><div class="r5-welcome-points"><span>${icon('calendar-days')}Планировать</span><span>${icon('play')}Смотреть</span><span>${icon('users')}Вместе</span></div>${button('Начать '+icon('arrow-right'),'start')}</section>`;}
function modes(){return intro('Как вы хотите пользоваться приложением?', 'Выберите, где будут храниться аккаунт, списки и статус просмотра.', `<div class="r5-modes"><button class="r5-mode" data-action="choose-mode" aria-pressed="true">${icon('server')}<div><strong>Сервер управления</strong><p>Подбор аниме, аккаунт и списки — на сервере. Скачивание и подготовка — на этом устройстве.</p></div></button><button class="r5-mode" disabled>${icon('monitor')}<div><strong>Автономное управление</strong><p>Все данные запрашиваются и хранятся на этом устройстве.</p><span class="r5-unavailable">${icon('lock-keyhole')}После 1.0</span></div></button></div><div class="r5-actions end">${button('Далее '+icon('arrow-right'),'mode-next')}</div>`);}
function auth(){return intro(state.register?'Создать аккаунт':'Добро пожаловать',state.register?'Аккаунт создаётся на выбранном сервере.':'Войдите в аккаунт этого сервера.',`<div class="r5-selected-server">${icon('server')}<span>${esc(state.server.host)}</span></div><form class="r5-form" id="r5-auth-form"><label><span class="r5-label">Логин</span><input name="login" autocomplete="username" required minlength="3" placeholder="Ваш логин" ${state.error?'value="demo_viewer"':''}></label><label><span class="r5-label">Пароль</span><input name="password" type="password" autocomplete="${state.register?'new-password':'current-password'}" required minlength="8" placeholder="Не менее 8 символов" ${state.error?'aria-invalid="true"':''}></label>${state.register?'<label><span class="r5-label">Пароль ещё раз</span><input name="confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Повторите пароль"></label>':''}${error()}<button class="r5-primary r5-full" type="button" data-action="submit-auth">${state.register?'Создать аккаунт':'Войти'}</button></form><div class="r5-form-toggle"><span>${state.register?'Уже есть аккаунт?':'Пока нет аккаунта?'}</span><button class="r5-link" data-action="toggle-auth">${state.register?'Войти':'Зарегистрироваться'}</button></div><p class="r5-muted r5-small" style="margin-top:22px">Сессия и привязка устройства сохраняются отдельно для каждого сервера.</p>`,true);}
function access(){if(state.scenario==='denied')return intro('Доступ пока закрыт','Администратор отклонил запрос. Аккаунт сохранён; вы можете обратиться к владельцу сервера или подключить другой.',`${error()}<div class="r5-actions">${button('Выбрать другой сервер','other-server','secondary')}</div>`,true);
 const pending=state.waiting?`<div class="r5-pending"><span class="r5-spinner" aria-hidden="true"></span><div><strong>Ожидаем одобрения</strong><small>Можно закрыть приложение. При следующем запуске вернём вас сюда.</small></div></div>`:`<h3>Попросить доступ</h3><p>Администратор получит ваш запрос.</p>${button('Запросить доступ','request-access','secondary')}`;
 return intro('Осталось получить доступ','Аккаунт создан. Можно дождаться одобрения или воспользоваться приглашением.',`<div class="r5-access-choice"><div>${pending}</div><div><h3>У вас есть приглашение?</h3>${state.invite?`<form id="r5-invite-form"><label><span class="r5-label">Ссылка или код приглашения</span><input name="invite" autocomplete="off" required placeholder="Вставьте ссылку или код" value="${state.scenario==='expired'?'DEMO-EXPIRED':state.scenario==='used'?'DEMO-USED':''}" ${state.error?'aria-invalid="true"':''} value="${state.scenario==='expired'?'DEMO-EXPIRED':state.scenario==='used'?'DEMO-USED':''}"></label>${error()}<div class="r5-actions">${button('Применить','apply-invite')}</div></form>`:`<p>Одноразовая ссылка сразу откроет доступ.</p><button class="r5-link" data-action="show-invite">Ввести приглашение</button>`}</div></div>`,true);}
function links(){return intro('Добавим то, что уже ваше','Необязательно. Всё это можно настроить позже.',`<div class="r5-connections"><div class="r5-connection">${icon('monitor')}<div><h3>Этот компьютер</h3><p>Загрузка серий из веба и доступ для комнат.</p></div>${state.bound?`<span class="r5-status">${icon('check')}Привязан</span>`:button('Привязать','bind','secondary')}</div><div class="r5-connection">${icon('book-open')}<div><h3>Shikimori</h3><p>Перенести ваши списки и статусы просмотра.</p></div>${state.shiki?`<span class="r5-status">${icon('check')}Подключён</span>`:button('Подключить','shiki','secondary')}</div></div><div class="r5-actions end">${button(state.bound||state.shiki?'Далее':'Пропустить','sync-start')}</div>`);}
function sync(){const labels=['Аккаунт и списки','Прогресс просмотра','Устройство',...(state.shiki?['Импорт Shikimori']:[])],total=labels.length;const percent=Math.min(100,Math.round(state.sync/total*100));return intro(state.syncDone?'Можно начинать':state.importError?'Списки готовы. Импорт прервался.':'Собираем всё на месте',state.syncDone?'Аккаунт и выбранные подключения сохранены. При следующем запуске откроется этот сервер.':state.importError?'Shikimori сейчас не отвечает. Основной интерфейс доступен.':'Синхронизируем данные с выбранным сервером.',`<div class="r5-sync-list">${labels.map((name,i)=>`<div class="r5-sync-row"><span>${i<state.sync?icon('check'):i===state.sync&&!state.importError?'<span class="r5-spinner" style="width:17px;height:17px" aria-hidden="true"></span>':icon(state.importError&&i===total-1?'circle-alert':'minus')}<span>${name}</span></span><small>${i<state.sync?'Готово':state.importError&&i===total-1?'Нет соединения':i===state.sync?'Синхронизация…':'Ожидает'}</small></div>`).join('')}</div><div class="r5-progress" role="progressbar" aria-label="Синхронизация" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${percent}%"></span></div>${state.importError?`<div class="r5-actions">${button('Повторить импорт','retry-import','secondary')}${button('Продолжить без импорта','finish')}</div>`:state.syncDone?`<div class="r5-actions end">${button('Открыть приложение '+icon('arrow-right'),'finish')}</div>`:''}`,true);}
function home(){const isDev=state.server.host===dev.host,isOther=state.server.host!==prod.host,page=state.page;let content='';if(page==='settings')content=`<h1>Настройки</h1><p class="r5-intro">${esc(state.server.name)}</p><h2>Это устройство</h2><div class="r5-session-line"><div><h3>Мой компьютер</h3><p>${state.bound?'Привязан к этому аккаунту и серверу.':'Можно искать и планировать. Для локальных загрузок привяжите устройство.'}</p></div>${button(state.bound?'Устройство подключено':'Привязать','bind','secondary',state.bound?'disabled':'')}</div><h2>Подключения</h2><div class="r5-session-line"><div><h3>Shikimori</h3><p>${state.shiki?'Подключён':'Импорт списков и статусов'}</p></div>${button(state.shiki?'Подключён':'Подключить','shiki','secondary',state.shiki?'disabled':'')}</div>`;else if(page==='room')content=`<h1>Комната просмотра</h1><p class="r5-intro">Совместный просмотр продолжается на ${esc(state.server.host)}.</p><h2>Провожающая в последний путь Фрирен</h2><p class="r5-muted">Серия 6 · Вы предоставляете видео участникам.</p><div class="r5-actions">${button('Завершить просмотр','stop-watching','secondary')}</div>`;else content=`<h1>Главная${isDev?'<span class="r5-tag">Разработка</span>':''}</h1><p class="r5-intro">${isOther?'Отдельный сервер. Свой аккаунт, списки и привязка.':'Ваш просмотр, планы и устройства.'}</p>${isOther?`<div class="r5-empty"><h2>Здесь свой вечер</h2><p>Списки этого сервера не меняют списки на Пивосинеме.</p></div>`:`<h2>Продолжить просмотр</h2><div class="r5-continuation"><div class="r5-cover">${icon('image')}</div><div><h3>Провожающая в последний путь Фрирен</h3><p>Серия 6 · Сохранена позиция 12:34</p>${button(icon('play')+'Продолжить','watch','primary')}</div></div><h2>Ближайший сеанс</h2><div class="r5-session-line"><div><h3>Вечер в комнате</h3><p>Завтра в 20:00 · Фрирен, серии 6–7</p></div>${button('Открыть сеанс '+icon('arrow-right'),'room','secondary')}</div><h2>Текущие загрузки</h2><div class="r5-download-line"><div><h3>Подземелье вкусностей</h3><p>${state.activeJob?'Загрузка на этом компьютере':state.pausedJob?'Приостановлено при смене сервера':'Серии 1–3 · На этом компьютере'}</p></div><div class="r5-download-bar"><div class="r5-progress"><span style="width:54%"></span></div><span class="r5-small r5-muted">1,6 из 3 ГБ</span></div></div>`}`;

root.addEventListener('click',e=>{if(state.pickerOpen&&!e.target.closest('.r5-picker')){state.pickerOpen=false;render();}});
$('#r5-server-menu').addEventListener('click',()=>{state.menu=!state.menu;state.menuFilter='';render();if(state.menu)$('#r5-menu-options button')?.focus();});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.closest('#r5-auth-form')){e.preventDefault();submitAuth();return;}if(e.key==='Enter'&&e.target.closest('#r5-invite-form')){e.preventDefault();applyInvite();return;}if(e.key==='Escape'){const wizardOpen=state.pickerOpen,open=state.menu||state.menuDialog||wizardOpen;state.menu=false;state.pickerOpen=false;state.menuDialog=null;if(open){render();(wizardOpen?$('[data-action=toggle-picker]'):$('#r5-server-menu'))?.focus();}}if(e.target.closest('[role=menu]')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=[...e.target.closest('[role=menu]').querySelectorAll('button')],i=items.indexOf(e.target.closest('button'));items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}if(e.key==='Tab'&&state.menuDialog){const buttons=[...$('#r5-overlay').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}if(e.key==='Enter'&&e.target.dataset.address){e.preventDefault();$('#r5-stage [data-action=connect]')?.click();}if(e.key==='ArrowDown'&&e.target.dataset.query){e.preventDefault();$(`#r5-${e.target.dataset.query}-options button`)?.focus();}});
document.addEventListener('click',e=>{if(state.menu&&!e.target.closest('#r5-server-popover')&&!e.target.closest('#r5-server-menu')){state.menu=false;render();}});
$('#r5-scenario').addEventListener('change',e=>chooseScenario(e.target.value));$('#r5-event').addEventListener('click',()=>{state.waiting=false;state.server.access='approved';go('links');});
function applySavedUi(saved){if(saved?.version!==1||!saved.ui||!['welcome','mode','server','auth','access','links','sync','home'].includes(saved.ui.step))return;if(JSON.stringify(saved.ui)===lastWidgetSnapshot)return;generation++;state={...fresh(),...saved.ui,menu:false,menuDialog:null,query:'',menuFilter:''};const active=state.profiles.find(p=>p.id===state.server.id);if(active)state.server=active;$('#r5-scenario').value=state.scenario;render();if(state.step==='sync'&&!state.importError&&!state.syncDone)resumeSync();}
const auroraPositions={welcome:[-2,0],mode:[3,-4],server:[-5,2],auth:[4,5],access:[-3,-5],links:[6,0],sync:[0,4],home:[0,0]};
function updateAurora(){
 const layer=$('#r5-aurora'),plane=layer.querySelector('.r5-aurora-plane'),toggle=$('#r5-motion-toggle');
 const hidden=state.step==='home',paused=!!state.motionPaused||reducedMotion.matches||document.hidden||!windowVisible||hidden;
 layer.hidden=hidden;toggle.hidden=hidden;
 const [x,y]=auroraPositions[state.step]||[0,0];root.style.setProperty('--r5-pan-x',x+'%');root.style.setProperty('--r5-pan-y',y+'%');
 if(paused&&!$('.r5-window').classList.contains('r5-motion-paused')){plane.style.transform=getComputedStyle(plane).transform;plane.style.transition='none';}
 if(!paused&&$('.r5-window').classList.contains('r5-motion-paused')){plane.style.transition='';plane.style.transform='';}
 $('.r5-window').classList.toggle('r5-motion-paused',paused);
 toggle.disabled=reducedMotion.matches;toggle.setAttribute('aria-pressed',String(paused));
 const label=reducedMotion.matches?'Движение уменьшено в настройках системы':state.motionPaused?'Возобновить движение фона':'Остановить движение фона';
 toggle.setAttribute('aria-label',label);toggle.title=label;toggle.innerHTML=icon(paused?'play':'pause');
}
chooseScenario('fresh',false);applySavedUi(window.openai?.widgetState?.privateContent);
window.addEventListener('openai:set_globals',e=>applySavedUi(e.detail?.globals?.widgetState?.privateContent));
document.addEventListener('visibilitychange',()=>{updateAurora();if(document.hidden)settleDrops();});reducedMotion.addEventListener('change',()=>{updateAurora();if(reducedMotion.matches)settleDrops();icons();});
if(globalThis.IntersectionObserver)new IntersectionObserver(entries=>{windowVisible=entries[0].isIntersecting;updateAurora();icons();}).observe($('.r5-window'));
if(globalThis.Tweak){const control=new Tweak({container:root,onChange:()=>{root.style.setProperty('--r5-form',tweaks.width+'px');root.style.setProperty('--r5-motion',tweaks.motion+'ms');root.querySelectorAll('.r5-server-row').forEach(el=>el.style.padding=tweaks.compact?'8px 10px':'11px 10px');}});control.addSlider(tweaks,'width',{label:'Ширина мастера',min:480,max:720,step:10,unit:'px'});control.addSlider(tweaks,'motion',{label:'Длительность перехода',min:100,max:420,step:20,unit:'мс'});control.addToggle(tweaks,'compact',{label:'Компактные строки серверов'});}
})();
</script>
